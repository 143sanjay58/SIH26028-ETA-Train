version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: railway-postgres
    environment:
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: railway
      POSTGRES_DB: railway_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  redis:
    image: redis:7-alpine
    container_name: railway-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - railway-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railway-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://railway:railway@postgres:5432/railway_intelligence
      - REDIS_URL=redis://redis:6379/0
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./simulator:/app/simulator
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - railway-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - railway-network

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railway-simulator
    environment:
      - DATABASE_URL=postgresql+asyncpg://railway:railway@postgres:5432/railway_intelligence
      - REDIS_URL=redis://redis:6379/0
      - SIMULATION_SPEED=1.0
      - SIMULATION_SCENARIO=normal
    volumes:
      - ./simulator:/app/simulator
      - ./backend:/app/backend
      - ./ml:/app/ml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m simulator.engine.run
    networks:
      - railway-network

volumes:
  postgres_data:
  redis_data:

networks:
  railway-network:
    driver: bridge